<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Zhiyu Xunzhen - Clinical Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAFBFC;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.7);
        }
        .clinical-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 52, 65, 0.05), 0 2px 4px -1px rgba(0, 52, 65, 0.03);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f9f9fa",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#edeeef",
                        "on-primary-fixed": "#001f28",
                        "primary-fixed-dim": "#9acee1",
                        "inverse-surface": "#2e3132",
                        "secondary-fixed": "#dfe3e6",
                        "primary-fixed": "#b6ebfe",
                        "primary": "#003441",
                        "outline": "#70787c",
                        "on-error-container": "#93000a",
                        "on-background": "#191c1d",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-dim": "#d9dadb",
                        "on-tertiary-fixed-variant": "#454748",
                        "on-error": "#ffffff",
                        "outline-variant": "#c0c8cb",
                        "surface": "#f9f9fa",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#5e6366",
                        "surface-container-low": "#f3f4f5",
                        "background": "#FAFBFC",
                        "tertiary-fixed": "#e1e3e4",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#9acee1",
                        "on-secondary-fixed-variant": "#43474a",
                        "on-surface-variant": "#40484b",
                        "secondary-container": "#dce0e3",
                        "error-container": "#ffdad6",
                        "primary-container": "#0F4C5C",
                        "on-primary-fixed-variant": "#114d5d",
                        "secondary": "#5a5f62",
                        "on-secondary-fixed": "#171c1f",
                        "on-primary-container": "#87bbce",
                        "tertiary": "#2d3031",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e1e2e4",
                        "secondary-fixed-dim": "#c3c7ca",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#434647",
                        "tertiary-fixed-dim": "#c5c7c8",
                        "surface-tint": "#306576",
                        "on-tertiary-fixed": "#191c1d",
                        "on-surface": "#191c1d",
                        "surface-variant": "#e1e2e4",
                        "on-tertiary-container": "#b2b4b5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-gap-sm": "8px",
                        "section-margin": "40px",
                        "unit": "4px",
                        "container-padding": "20px",
                        "stack-gap-lg": "24px",
                        "stack-gap-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "medical-data": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                        "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
                        "medical-data": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Subtle atmospheric background animation -->
<div class="fixed inset-0 z-0 opacity-10 pointer-events-none">

</div>
<main class="relative z-10 flex-grow flex items-center justify-center px-container-padding py-section-margin">
<div class="w-full max-w-[420px] space-y-stack-gap-lg">
<!-- Branding Section -->
<header class="text-center space-y-stack-gap-sm animate-fade-in">
<div class="inline-flex items-center justify-center mb-4">
<svg class="text-primary-container" fill="none" height="48" viewbox="0 0 48 48" width="48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 4L28.5 19.5H44L31.5 29L36 44.5L24 35L12 44.5L16.5 29L4 19.5H19.5L24 4Z" fill="currentColor"></path>
<circle cx="24" cy="25" fill="#FAFBFC" r="5"></circle>
</svg>
</div>
<h1 class="font-display-lg text-display-lg text-primary-container">Zhiyu Xunzhen</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome to Clinical Excellence</p>
</header>
<!-- Login Form -->
<div class="bg-surface-container-lowest border border-outline-variant p-8 rounded-xl clinical-shadow space-y-6">
<form class="space-y-5" id="loginForm">
<!-- Account Input -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="account">Account</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md" id="account" name="account" placeholder="Email or Medical ID" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary-container transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-xl focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary-container text-white font-headline-sm text-headline-sm rounded-xl hover:opacity-95 active:scale-[0.98] transition-all duration-150 clinical-shadow" type="submit">
                        Login
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center space-x-3">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-caps text-label-caps text-outline">or</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Secondary Actions -->
<button class="w-full py-3 flex items-center justify-center space-x-2 border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
<span class="font-body-md text-on-surface-variant">Institutional Access</span>
</button>
</div>
<!-- Footer Links -->
<footer class="flex justify-between px-2">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary-container transition-colors" href="#">Contact Support</a>
</footer>
<!-- Medical Data Decorative Element -->
<div class="pt-8 opacity-40">
<div class="flex justify-center items-center space-x-4">
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
<p class="font-medical-data text-medical-data text-outline">V.2.4.0 • SECURE CLINICAL NODE</p>
<div class="w-1.5 h-1.5 rounded-full bg-outline-variant"></div>
</div>
</div>
</div>
</main>
<!-- Background Decoration -->
<div class="fixed bottom-0 right-0 p-12 opacity-5 pointer-events-none">
<div class="w-96 h-96 border-[40px] border-primary rounded-full -mr-48 -mb-48"></div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Form interaction simulation
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Authenticating...</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }, 2000);
        });

        // Simple Fade-in Animation on load
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('transition-opacity', 'duration-700', 'opacity-100');
        });
    </script>
</body></html>
