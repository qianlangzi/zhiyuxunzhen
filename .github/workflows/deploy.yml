name: 自动构建推镜像并部署 zhiyu-new

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 在 CI 构建镜像并推送到 ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # 允许往 ghcr.io 推送镜像
    env:
      REGISTRY: ghcr.io
      IMAGE_NS: qianlangzi
      ZHIYU_IMAGE_TAG: latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ---- backend (Maven 多阶段构建) ----
      - name: 构建 & 推送 backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-backend:${{ env.ZHIYU_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-backend:latest
          cache-to: type=inline

      # ---- ai (Python 多阶段构建) ----
      - name: 构建 & 推送 ai
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-ai:${{ env.ZHIYU_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-ai:latest
          cache-to: type=inline

      # ---- ai-worker (与 ai 同一代码库,单独镜像名) ----
      - name: 构建 & 推送 ai-worker
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-ai-worker:${{ env.ZHIYU_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-ai-worker:latest
          cache-to: type=inline

      # ---- front (npm 多阶段构建) ----
      - name: 构建 & 推送 front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-front:${{ env.ZHIYU_IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/zhiyu-front:latest
          cache-to: type=inline

  deploy:
    name: 服务器 pull 预构建镜像并重启
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 通过 SSH 远程部署（仅 pull，不再本地 build）
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /opt/zhiyu-new
            # 服务器仓库只用于取代码里的 compose 配置，不参与构建。
            git fetch origin main
            git reset --hard origin/main
            echo "--- 服务器版本 ---"
            git log --oneline -1
            # 登录 ghcr 以便拉取私有镜像
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u qianlangzi --password-stdin
            # 只强拉【本项目自有镜像】。第三方基础镜像（minio/mysql/redis/etcd/milvus/nginx）
            # 在服务器上已有固定版本，此前用 `up -d --pull always` 会把它们一并拉取，
            # 而服务器的 registry mirror（阿里云加速器）对 minio 返回 403 Forbidden，
            # 单个 pull 失败即中断整条 compose 命令 —— 镜像其实已拉到本地，容器却
            # 一个都没重建（2026-09-12 部署失败根因，见运维大全）。
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              -f docker-compose.image.yml --profile web pull backend ai ai-worker front
            # 再重建容器：此处不带 --pull always，避免第三方镜像再次触发 mirror 403
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              -f docker-compose.image.yml --profile web up -d --force-recreate
            echo "===== 部署后自检 ====="
            docker inspect zhiyu-backend --format 'backend StartedAt: {{.State.StartedAt}}'
            docker inspect zhiyu-ai --format 'ai StartedAt: {{.State.StartedAt}}'
            timeout 60 curl -s -o /dev/null -w 'health HTTP %{http_code}\n' http://localhost/api/v1/health || true