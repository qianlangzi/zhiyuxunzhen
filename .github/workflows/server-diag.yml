name: 服务器部署验证（最终）

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 验证迁移与容器状态
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/zhiyu-new
            echo "===== 1. 服务器版本 ====="
            git log --oneline -2
            echo "===== 2. backend 启动时间 ====="
            docker inspect zhiyu-backend --format 'StartedAt: {{.State.StartedAt}}'
            echo "===== 3. Flyway 最新迁移 ====="
            docker exec zhiyu-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE zhiyu_db; SELECT version, description, success FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 4;"' 2>/dev/null
            echo "===== 4. V48 索引 ====="
            docker exec zhiyu-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "USE zhiyu_db; SHOW INDEX FROM practice_question;"' 2>/dev/null | grep idx_pq
            echo "===== 5. backend 本次启动日志 ====="
            docker logs zhiyu-backend --since 30m 2>&1 | grep -iE "Migrating|Started ZhiyuApplication" | tail -5
            echo "===== 6. 线上健康 ====="
            curl -s -o /dev/null -w "health HTTP %{http_code}\n" http://localhost/api/v1/health
