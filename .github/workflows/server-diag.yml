name: 服务器部署失败根因诊断（第二轮）

on:
  workflow_dispatch:

jobs:
  diag2:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 深度诊断
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/zhiyu-new

            echo "===== A. git 状态与 pull 实测 ====="
            git status --short | head -10
            git remote -v
            echo "--- 手动 git pull 看真实报错 ---"
            git pull origin main 2>&1 | head -15

            echo "===== B. 手动 backend 构建实测（看真实报错） ====="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend 2>&1 | tail -25

            echo "===== C. Docker 磁盘占用 ====="
            docker system df
            echo "--- 镜像列表（含悬挂） ---"
            docker images --format "{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}" | head -20

            echo "===== D. compose 配置校验 ====="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config 2>&1 | head -5
