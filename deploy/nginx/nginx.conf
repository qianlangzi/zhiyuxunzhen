# =====================================================
# 智愈寻真 - 根级 Nginx 反向代理
# 生产环境:所有流量从 80/443 入口,由本文件统一分发
# 开发环境:不启用此容器,前端走 Vite dev server proxy
#
# 路由规则:
#   /              → 前端静态文件 (front 容器)
#   /api/v1/user   → Spring Boot 业务中台 (backend:8080)
#   /api/v1/ai     → FastAPI AI 中台 (ai:8000, SSE 需关闭缓冲)
# =====================================================

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream ai_upstream {
    server ai:8000;
    keepalive 16;
}

upstream front_upstream {
    server front:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # ---- 安全头 ----
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";

    # ---- 请求体大小(支持图片上传,PRD 5.2 单张 5MB) ----
    client_max_body_size 20m;

    # ---- 前端静态资源 ----
    location / {
        proxy_pass         http://front_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- 业务中台 Spring Boot ----
    # 注意:后端 controller 路由为 /api/v1/...,因此 proxy_pass 必须保留 /api 前缀,
    # 不能写成 http://backend_upstream/v1/... (那样会剥掉前缀导致 404)。
    location /api/v1/user/ {
        proxy_pass         http://backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ---- 业务中台其他接口(cases / assignment / review / weakness / reasoning) ----
    location /api/v1/ {
        proxy_pass         http://backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---- 业务中台 SSE 流式接口(AI 学伴 / SP 问诊聊天) ----
    # 关键:默认 proxy_buffering on 会把 Spring SseEmitter 的增量攒到 AI 全部生成完毕
    # 才一次性转发给 App,导致"没有打字机效果";此处按接口精确关闭缓冲并放宽读超时。
    location ~ ^/api/v1/student/(companion/stream|sessions/[0-9]+/chat/stream)$ {
        proxy_pass         http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;   # AI 流式可能持续 5 分钟
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ---- 内部回调接口(不对外暴露,仅容器网络可达) ----
    # /api/internal/* 不在此处代理,由 backend 容器内部直接调用

    # ---- AI 中台 SSE 流式接口 ----
    location /api/v1/ai/ {
        proxy_pass         http://ai_upstream/v1/ai/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE 关键:关闭缓冲,否则前端收不到流式数据
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;   # 问诊可能持续 5 分钟
        chunked_transfer_encoding on;
    }

    # ---- AI 中台其他接口(批阅/路径生成) ----
    location /ai/ {
        proxy_pass         http://ai_upstream/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---- 健康检查 ----
    location /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
