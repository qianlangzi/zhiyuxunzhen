# =====================================================
# Redis 7 配置
# =====================================================

# 绑定地址(容器内允许所有连接,安全由网络隔离保障)
bind 0.0.0.0

# 端口
port 6379

# 密码(生产环境务必设置,开发环境可留空)
# requirepass your_redis_password

# 持久化:RDB 快照
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# AOF 持久化(生产环境建议开启)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice
