# =====================================================
# 智愈寻真 - 生产环境覆盖配置
# 必须与 docker-compose.yml 一起使用:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 生产环境与开发环境的核心区别:
#   1. 数据卷用 Docker volume 而非本地目录
#   2. 前端走 Nginx 多阶段构建(非 Vite dev server)
#   3. 新增根级 Nginx 反向代理,统一 80 端口入口
#   4. 不暴露 MySQL/Milvus/Redis 等基础设施端口
#   5. 资源限制 + 健康检查
#   6. 日志驱动 + 重启策略
# =====================================================

services:

  # ---- MySQL:不暴露端口,仅容器网络可达 ----
  mysql:
    deploy:
      resources:
        limits:
          memory: 1G

  # ---- Redis:不暴露端口 ----
  redis:
    deploy:
      resources:
        limits:
          memory: 256M

  # ---- Milvus:不暴露端口 ----
  milvus:
    deploy:
      resources:
        limits:
          memory: 2G

  # ---- etcd / minio:不暴露端口 ----
  etcd: {}

  minio: {}

  # ---- 后端:生产配置 ----
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 生产强制注入 JWT_SECRET，缺失则 Compose 启动失败（fail-fast）
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET}
      # 生产强制注入 AI_INTERNAL_TOKEN（与 AI 中台一致，防伪造内部请求）
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?生产环境必须设置 AI_INTERNAL_TOKEN}
      # 生产强制配置 CORS 白名单，不允许通配符
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?生产环境必须设置 CORS_ALLOWED_ORIGINS}
      # 生产环境严禁创建演示账号
      DEMO_DATA: "false"
    volumes:
      - ./logs/backend:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---- AI:生产配置 ----
  ai:
    # 生产环境不用 --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      # 生产强制 prod 模式，触发 config.py validate_prod 拒绝默认密钥和通配 CORS
      ENV_MODE: prod
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?生产环境必须设置 AI_INTERNAL_TOKEN}
      OPS_TOKEN: ${OPS_TOKEN:?生产环境必须设置 OPS_TOKEN}
      # AI 端 CORS 使用 JSON 数组格式（如 ["https://admin.example.com"]）
      # 与 Java 端的 CORS_ALLOWED_ORIGINS（逗号分隔字符串）隔离，避免格式冲突
      AI_CORS_ALLOWED_ORIGINS: ${AI_CORS_ALLOWED_ORIGINS:?生产环境必须设置 AI_CORS_ALLOWED_ORIGINS}
      # 生产环境必须关闭 fallback（config.py validate_prod 拒绝开启状态）
      ENABLE_LLM_FALLBACK: "false"
      ENABLE_MILVUS_FALLBACK: "false"
    deploy:
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---- AI Worker:生产配置 ----
  # 基础 compose 的 ai-worker 通过 *ai-env 锚点继承 dev 配置，
  # 生产必须显式覆盖，否则 worker 以 dev 模式运行、使用缺失的默认 token
  ai-worker:
    environment:
      ENV_MODE: prod
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?生产环境必须设置 AI_INTERNAL_TOKEN}
      OPS_TOKEN: ${OPS_TOKEN:?生产环境必须设置 OPS_TOKEN}
      AI_CORS_ALLOWED_ORIGINS: ${AI_CORS_ALLOWED_ORIGINS:?生产环境必须设置 AI_CORS_ALLOWED_ORIGINS}
      ENABLE_LLM_FALLBACK: "false"
      ENABLE_MILVUS_FALLBACK: "false"
    deploy:
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---- 前端:生产用多阶段构建 Nginx ----
  front:
    # 生产环境用默认 Dockerfile(多阶段构建 → Nginx)
    # 不挂载源码,不暴露端口(由根级 nginx 代理)
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== 生产环境专用 ====================

  # ---- 根级 Nginx 反向代理:统一 80 端口入口 ----
  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyu-nginx
    restart: always
    depends_on:
      - front
      - backend
      - ai
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # 如需 HTTPS,取消下行注释并挂载证书
      # - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书(按需)
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      # 用 127.0.0.1 而非 localhost：容器内 localhost 可能解析为 IPv6 ::1，
      # 而 nginx 只监听 IPv4，会导致健康检查误报 unhealthy
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
