# =====================================================
# 智愈寻真 - 生产环境覆盖配置
# 必须与 docker-compose.yml 一起使用:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 生产环境与开发环境的核心区别:
#   1. 数据卷用 Docker volume 而非本地目录
#   2. 前端走 Nginx 多阶段构建(非 Vite dev server)
#   3. 新增根级 Nginx 反向代理,统一 80 端口入口
#   4. 不暴露 MySQL/Milvus/Redis 等基础设施端口
#   5. 资源限制 + 健康检查
#   6. 日志驱动 + 重启策略
# =====================================================

services:

  # ---- MySQL:不暴露端口,仅容器网络可达 ----
  mysql:
    deploy:
      resources:
        limits:
          memory: 1G

  # ---- Redis:不暴露端口 ----
  redis:
    deploy:
      resources:
        limits:
          memory: 256M

  # ---- Milvus:不暴露端口 ----
  milvus:
    deploy:
      resources:
        limits:
          memory: 2G

  # ---- etcd / minio:不暴露端口 ----
  etcd: {}

  minio: {}

  # ---- 后端:生产配置 ----
  backend:
    environment:
      SPRING_PROFILE: prod
    volumes:
      - ./logs/backend:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---- AI:生产配置 ----
  ai:
    # 生产环境不用 --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    deploy:
      resources:
        limits:
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ---- 前端:生产用多阶段构建 Nginx ----
  front:
    # 生产环境用默认 Dockerfile(多阶段构建 → Nginx)
    # 不挂载源码,不暴露端口(由根级 nginx 代理)
    deploy:
      resources:
        limits:
          memory: 256M

  # ==================== 生产环境专用 ====================

  # ---- 根级 Nginx 反向代理:统一 80 端口入口 ----
  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyu-nginx
    restart: always
    depends_on:
      - front
      - backend
      - ai
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # 如需 HTTPS,取消下行注释并挂载证书
      # - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书(按需)
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
