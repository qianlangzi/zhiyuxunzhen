server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: zhiyu-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

# MyBatis Plus 全局配置（各 profile 可覆盖日志实现）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO

# JWT 配置 —— secret 由各 profile 提供，prod 强制环境变量注入
zhiyu:
  jwt:
    expire-hours: ${JWT_EXPIRE_HOURS:24}
    refresh-expire-hours: ${JWT_REFRESH_EXPIRE_HOURS:168}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  ai:
    base-url: ${AI_BASE_URL:http://ai:8000}
    internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token}
  sms:
    provider: ${SMS_PROVIDER:}
    juhe:
      key: ${SMS_JUHE_KEY:}
      tpl-id: ${SMS_JUHE_TPL_ID:0b7c3395e652840bc2ade53e1214dec1}
  upload:
    max-file-size: 5MB
    allowed-types: jpg,jpeg,png,pdf
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# OpenAPI / Swagger 文档（PRD 16.3.2）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: true
  packages-to-scan: com.zhiyu.controller
  paths-to-match: /api/v1/**
