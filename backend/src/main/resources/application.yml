server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: zhiyu-backend
  profiles:
    # fail-closed：不设默认值，SPRING_PROFILES_ACTIVE 缺失时 Spring 会激活字面量
    # "${SPRING_PROFILES_ACTIVE}"，ProfileValidator 会拒绝它。
    # 直接 JAR/systemd/K8s 启动也必须显式设置 SPRING_PROFILES_ACTIVE=dev/test/prod。
    # Docker 由 docker-compose.yml 的 ${...:?} 强制注入，缺失则 Compose 拒绝启动。
    # DataInitializer 仅 dev/test 激活；ProdSecurityInitializer 仅 prod 激活。
    active: ${SPRING_PROFILES_ACTIVE}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # multipart 全局限制：在 Spring 接收阶段就拒绝超大文件，避免 OOM
  # 课件资料（教案上传的 PDF/PPT/视频）体积较大，放宽到 50MB；
  # UserImportServiceImpl.MAX_FILE_SIZE(10MB) 仍独立校验导入文件大小。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

# MyBatis Plus 全局配置（各 profile 可覆盖日志实现）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: AUTO

# JWT 配置 —— secret 由各 profile 提供，prod 强制环境变量注入
zhiyu:
  jwt:
    expire-hours: ${JWT_EXPIRE_HOURS:24}
    refresh-expire-hours: ${JWT_REFRESH_EXPIRE_HOURS:168}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  ai:
    base-url: ${AI_BASE_URL:http://ai:8000}
    internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token}
  sms:
    provider: ${SMS_PROVIDER:}
    juhe:
      key: ${SMS_JUHE_KEY:}
      # 模板 ID（数字，聚合数据后台审核通过的短信模板）必须通过环境变量注入，禁止用占位符回退
      tpl-id: ${SMS_JUHE_TPL_ID:}
    # 阿里云「短信认证」（号码认证服务 PNVS）：个人认证可用，免资质/免签名/免模板，
    # 使用平台赠送的签名与模板（控制台 → 短信认证参数配置）。
    # provider=aliyun_auth 时生效；验证码仍由本系统生成并校验。
    aliyun:
      access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
      valid-seconds: ${ALIYUN_SMS_VALID_SECONDS:300}
      scheme-name: ${ALIYUN_SMS_SCHEME_NAME:}
  upload:
    max-file-size: 5MB
    allowed-types: jpg,jpeg,png,pdf
    dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

# OpenAPI / Swagger 文档（PRD 16.3.2）
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    persist-authorization: true
  packages-to-scan: com.zhiyu.controller
  paths-to-match: /api/v1/**
