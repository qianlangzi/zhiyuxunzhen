# 开发环境配置 —— 端口全暴露、SQL 日志 stdout、CORS 放开
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/${MYSQL_DATABASE:zhiyu_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# 开发环境 JWT secret（仅本地调试用，生产环境禁止使用）
zhiyu:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-32chars-minimum-aaaa}
  init:
    # 演示数据开关：仅 dev/test 开启，生产环境必须为 false
    # 控制 DataInitializer 是否创建 teacher01/student01/admin01 演示账号
    demo-data: ${DEMO_DATA:true}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.zhiyu: DEBUG
    org.springframework.web: DEBUG
