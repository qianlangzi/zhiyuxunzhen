# 生产环境配置 —— 收紧安全、SSL、CORS 白名单、SQL 日志走 Slf4j
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${MYSQL_DATABASE:zhiyu_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

# 生产环境 JWT secret 和 AI 内部 token 必须由环境变量注入，无默认值
zhiyu:
  jwt:
    secret: ${JWT_SECRET}
  # 内部回调 token 亦必须在生产环境显式注入，缺失即启动失败，避免使用可预测默认值
  ai:
    internal-token: ${AI_INTERNAL_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    # 生产强制注入 AI_INTERNAL_TOKEN，缺失则启动失败（与 AI 中台一致，防伪造内部请求）
    internal-token: ${AI_INTERNAL_TOKEN}
  init:
    # 生产环境严禁创建演示账号（admin01/teacher01/student01）
    demo-data: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.zhiyu: INFO
    org.springframework.web: WARN
