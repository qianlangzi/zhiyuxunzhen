# 生产环境配置 —— 收紧安全、SSL、CORS 白名单、SQL 日志走 Slf4j
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${MYSQL_DATABASE:zhiyu_db}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

# 生产环境 JWT secret 和 AI 内部 token 必须由环境变量注入，无默认值
zhiyu:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    # 生产强制注入 AI_INTERNAL_TOKEN，缺失则启动失败（与 AI 中台一致，防伪造内部请求）
    internal-token: ${AI_INTERNAL_TOKEN}
  init:
    # 演示账号开关：默认 false（生产安全）。仅在显式设 DEMO_DATA=true（如测试环境）时创建
    demo-data: ${DEMO_DATA:false}
  textbook:
    ingest-reconcile:
      # 教材入库自动对账：每 10 分钟扫描「处理中超 30 分钟未回调」的任务并自动重触发。
      # 生产自动重试上限放宽到 5 次，避免偶发网络/worker 抖动即耗尽预算；仍可控不会无限重试。
      cron: "0 */10 * * * ?"
      max-auto-retry: 5
      stale-after-minutes: 30

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.zhiyu: INFO
    org.springframework.web: WARN
