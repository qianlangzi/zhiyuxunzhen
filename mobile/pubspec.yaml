name: zhiyu_xunzhen
description: "智愈寻真 - 内科教研协同智能体平台移动端"
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.5.0+1

  # UI
  material_design_icons_flutter: ^7.0.7296
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.69.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Biometric / Local Auth
  local_auth: ^2.1.0

  # File system paths (cache dir etc.)
  path_provider: ^2.1.0

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  hive_generator: ^2.0.1

dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    # NotoSerifSC (思源宋体) 暂未打包：本环境无法下载该中文字体二进制。
    # 当前通过 fontFamilyFallback 回退到系统宋体（iOS: Songti SC / Android: Noto Serif CJK SC），
    # 视觉上与 Noto Serif SC 几乎一致。放入真实字体后，取消下方注释并运行 flutter pub get 即可生效。
    # - family: NotoSerifSC
    #   fonts:
    #     - asset: assets/fonts/NotoSerifSC-Regular.ttf
    #     - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
    #       weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
