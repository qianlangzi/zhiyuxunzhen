# =====================================================
# 智愈寻真 - Docker Compose 基础配置
# 此文件定义所有服务的通用构建与运行参数
#
# 开发环境: docker compose up -d --build
#   (自动合并 docker-compose.override.yml)
#
# 生产环境: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =====================================================

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: zhiyu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyu_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhiyu-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: zhiyu-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: zhiyu-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: zhiyu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/milvus/milvus.yaml:/milvus/configs/milvus.yaml:ro

  # ==================== 业务服务 ====================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhiyu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyu_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-to-a-random-32-char-string}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: zhiyu-ai
    restart: unless-stopped
    depends_on:
      - milvus
      - redis
    environment:
      SPARK_APP_ID: ${SPARK_APP_ID:-}
      SPARK_API_KEY: ${SPARK_API_KEY:-}
      SPARK_API_SECRET: ${SPARK_API_SECRET:-}
      SPARK_VISION_APP_ID: ${SPARK_VISION_APP_ID:-}
      SPARK_VISION_API_KEY: ${SPARK_VISION_API_KEY:-}
      SPARK_VISION_API_SECRET: ${SPARK_VISION_API_SECRET:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_CALLBACK_URL: http://backend:8080

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: zhiyu-front
    restart: unless-stopped
    depends_on:
      - backend
      - ai

# ==================== 数据卷 ====================
volumes:
  mysql_data:
  redis_data:
  milvus_data:
  etcd_data:
  minio_data:
