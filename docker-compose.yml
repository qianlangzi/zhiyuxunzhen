# =====================================================
# 智愈寻真 - Docker Compose 基础配置
# 此文件定义所有服务的通用构建与运行参数
#
# 开发环境: docker compose up -d --build
#   (自动合并 docker-compose.override.yml)
#
# 生产环境: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =====================================================

x-no-proxy-env: &no-proxy-env
  NO_PROXY: localhost,127.0.0.1,::1,mysql,redis,etcd,minio,milvus,backend,ai,front
  no_proxy: localhost,127.0.0.1,::1,mysql,redis,etcd,minio,milvus,backend,ai,front

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: zhiyu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyu_db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhiyu-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: zhiyu-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: zhiyu-minio
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: zhiyu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      <<: *no-proxy-env
    # 用 Docker 内建 DNS 按服务名解析（同一自定义网络内），避免静态 IP 漂移导致的失联。
    # 若个别环境 DNS 解析异常，可在此临时加入 extra_hosts，但必须与 docker inspect 实际 IP 一致。
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
    volumes:
      - milvus_data:/var/lib/milvus
      - ./deploy/milvus/milvus.yaml:/milvus/configs/milvus.yaml:ro

  # ==================== 业务服务 ====================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhiyu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *no-proxy-env
      # 强制显式指定 profile：.env 中必须设置 SPRING_PROFILES_ACTIVE（dev/test/prod）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?请在 .env 中设置 SPRING_PROFILES_ACTIVE（dev/test/prod）}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyu_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 演示数据开关：dev 默认 true（创建 admin01/teacher01/student01），prod 由 docker-compose.prod.yml 覆盖
      DEMO_DATA: ${DEMO_DATA:-true}
      # JWT_SECRET 不在此注入：dev profile 由 application-dev.yml 提供内置 dev 密钥
      # prod 由 docker-compose.prod.yml 强制 ${JWT_SECRET:?...} 注入，缺失则启动失败
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      # 短信验证码：由 .env 注入，容器内才能真实发送短信（此前缺失导致回退降级）
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_JUHE_KEY: ${SMS_JUHE_KEY:-}
      SMS_JUHE_TPL_ID: ${SMS_JUHE_TPL_ID:-}
      # AI 模型密钥：DataInitializer 种子从环境变量读取（值在 .env，勿硬编码进代码）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_HOST: ${DASHSCOPE_HOST:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      # 上传目录指向与 AI 共享的对象存储根目录（host ./data/objects，AI 侧只读挂载）：后端可写、AI 读取 PDF 入库
      UPLOAD_DIR: /app/data/objects
      UPLOAD_BASE_URL: /uploads
    volumes:
      - ./data/objects:/app/data/objects

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: zhiyu-ai
    restart: unless-stopped
    depends_on:
      - milvus
      - redis
    environment: &ai-env
      <<: *no-proxy-env
      ENV_MODE: ${ENV_MODE:-dev}
      # LLM（OpenAI 兼容协议，留空则降级）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-generalv3.5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      # 多模态
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-4.0VImage}
      VISION_ALLOWED_HOSTS: ${VISION_ALLOWED_HOSTS:-[]}
      # Embedding
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-v1}
      # DashScope 多模态 Embedding（Qwen3-VL-Embedding，实验验证最优）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://YOUR_DASHSCOPE_WORKSPACE.cn-beijing.maas.aliyuncs.com/api/v1}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3-vl-embedding}
      DASHSCOPE_EMBEDDING_DIM: ${DASHSCOPE_EMBEDDING_DIM:-1024}
      # MMORE PDF 处理服务
      MMORE_URL: ${MMORE_URL:-http://mmore:8002}
      # Milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-zhiyu_textbook}
      MILVUS_VECTOR_DIM: ${MILVUS_VECTOR_DIM:-1024}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 内部 token / JWT 密钥：dev 不在此注入，由 config.py 使用内置 dev 默认值
      # prod 由 docker-compose.prod.yml 强制 ${VAR:?...} 注入，缺失则启动失败
      OBJECT_STORAGE_ROOT: ${OBJECT_STORAGE_ROOT:-/app/data/objects}
      OBJECT_STORAGE_MAX_BYTES: ${OBJECT_STORAGE_MAX_BYTES:-52428800}
      BACKEND_CALLBACK_URL: http://backend:8080
      # 生产环境必须显式配置为 false；开发环境可在 .env 中打开规则降级。
      ENABLE_LLM_FALLBACK: ${ENABLE_LLM_FALLBACK:-false}
      ENABLE_MILVUS_FALLBACK: ${ENABLE_MILVUS_FALLBACK:-false}
    volumes:
      - ./data/objects:/app/data/objects:ro
      # BM25 磁盘缓存持久化（hybrid 检索索引，容器重建不丢失）
      - ./data/bm25_cache:/app/data/bm25_cache
      # 教材配图共享目录：worker 入库时写图 + 登记 index.json，serve 端检索后按
      # image_key 回查原图 → SSE citation 带图 → 学生端随回复渲染（2026-09-02 #5）
      - ./data/textbook-images:/app/data/textbook-images

  ai-worker:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: zhiyu-ai-worker
    restart: unless-stopped
    depends_on:
      - backend
      - milvus
      - redis
    environment: &ai-worker-env
      <<: *ai-env
      AI_WORKER_TYPES: ${AI_WORKER_TYPES:-review,knowledge_ingest}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-1}
      # 并发消费者数：>1 时多本教材并行向量化入库（每本内部还有 embed_concurrency 并发）
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
    volumes:
      - ./data/objects:/app/data/objects:ro
      - ./data/bm25_cache:/app/data/bm25_cache
      # 与 ai 服务共享教材配图目录（worker 写 / ai 读），入库抽图后可跨容器回查
      - ./data/textbook-images:/app/data/textbook-images
    command: ["python", "-m", "app.workers.runner"]

  # ==================== MMORE PDF 处理服务 ====================
  # 多模态 PDF 解析：图文分离、表格提取、OCR
  # AI Worker 通过 HTTP 调用此服务处理上传的教材 PDF
  mmore:
    build:
      context: ./mmore
      dockerfile: Dockerfile
      # BuildKit 命名上下文：直接从实验仓库引用 MMORE 源码，避免复制大目录
      additional_contexts:
        repo: ./experiments/mmore/repo
    container_name: zhiyu-mmore
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./experiments/mmore/repo:/app/mmore_repo:ro
    environment:
      <<: *no-proxy-env
      OMP_NUM_THREADS: 2

  # Web 学生端已停用：产品形态为 Flutter App + 本地管理端(vite.admin.config.ts,端口5174)
  # 保留定义便于将来复用;通过 profiles 使其默认不随 docker compose up 启动
  front:
    profiles: ["web"]
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: zhiyu-front
    restart: unless-stopped
    depends_on:
      - backend
      - ai

  mobile:
    profiles: ["mobile"]
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: zhiyu-mobile-tools
    working_dir: /workspace/mobile
    volumes:
      - ./mobile:/workspace/mobile
      - flutter_pub_cache:/workspace/.pub-cache
    environment:
      PUB_CACHE: /workspace/.pub-cache
    command: sh -lc "flutter pub get && flutter analyze && flutter test"

# ==================== 数据卷 ====================
volumes:
  mysql_data:
  # 复用既有（外部）数据卷，避免容器重建/项目化后向量库等数据被孤立。
  # 这些卷由早期手动容器创建（未加 zhiyu_ 前缀），已含真实数据。
  redis_data:
    external: true
  milvus_data:
    external: true
  etcd_data:
    external: true
  minio_data:
    external: true
  flutter_pub_cache:
